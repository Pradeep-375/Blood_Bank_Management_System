apiVersion: v1
kind: Secret
metadata: { name: bloodbank-secret }
stringData:
  POSTGRES_PASSWORD: bloodbank
  JWT_SECRET: change-me-in-production
  DATABASE_URL: postgres://bloodbank:bloodbank@postgres:5432/bloodbank
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: bloodbank }
            - { name: POSTGRES_DB, value: bloodbank }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bloodbank-secret, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
