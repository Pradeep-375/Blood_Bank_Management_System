apiVersion: apps/v1
kind: Deployment
metadata: { name: bloodbank-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: bloodbank-app } }
  template:
    metadata: { labels: { app: bloodbank-app } }
    spec:
      containers:
        - name: app
          image: bloodbank-app:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: bloodbank-secret } }]
          readinessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: bloodbank-service }
spec:
  type: NodePort
  selector: { app: bloodbank-app }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30080 }]
